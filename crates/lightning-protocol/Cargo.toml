[package]
name = "lightning-protocol"
version = "0.1.0"
edition = "2024"
description = "Wire types shared by the lightning core, the Tauri shell and the wasm UI"

[features]
default = ["fs"]
# Summary::read/write and other std::fs helpers; turn off for wasm if wanted.
fs = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
uuid = { version = "1.27.0", features = ["v4"] }
