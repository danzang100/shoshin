[package]
name = "lightning-gui-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "Storage"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lightning-protocol = { path = "../crates/lightning-protocol", default-features = false }
console_error_panic_hook = "0.1.7"
pulldown-cmark = { version = "0.13.4", default-features = false }
